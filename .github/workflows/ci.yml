name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

  # Informative only: prints the benchmark tables (src/test, *Benchmark) and never fails the build.
  benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Benchmarks
        env:
          RSLIB_BENCH: '1'
          RSLIB_BENCH_MS: '100'
        run: mvn -B -ntp test -Dtest='*Benchmark' -Dsurefire.failIfNoSpecifiedTests=false
