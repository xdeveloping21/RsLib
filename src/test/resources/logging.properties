# Pruebas: los avisos de RsLib en la consola son esperados (muchas pruebas provocan errores a
# propósito) y no se muestran.
# Solo cambia la consola; las pruebas que revisan los registros siguen recibiendo todo.
handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=OFF
