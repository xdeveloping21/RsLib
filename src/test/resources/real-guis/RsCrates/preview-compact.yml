# ============================================================
#  RsCrates - crate preview (compact layout)
#  The same reward showcase in four rows: rewards and pages only.
#  Managed by RsLib: new keys merge in on boot, your values are kept.
# ============================================================
#
#  A crate opens this layout when its "preview-id" is
#  "preview-compact". The full layout is guis/preview.yml; everything
#  about how a reward icon is built is documented there and applies here
#  unchanged.
#
#  WHAT THIS LAYOUT LEAVES OUT
#  The filter toggle and the withdraw button. They are not missing by
#  accident: a layout that declares neither can never show them, whatever
#  config.yml says, which is the point of having a small one. To add
#  either, copy its template out of guis/preview.yml and give its letter
#  a cell in the layout below.
#
#  PLACEHOLDERS
#    in the title       {crate} {crate-id}
#    on a reward icon   {crate} {chance} {limit} {tags}
#    on the info icon   {crate} {rewards} {fail} {fail-chance} {lore}
#  {lore} is the key item's own lore, one lore line per line it has. The info
#  icon does not show it unless you write it: those lines are meant for a
#  player holding the key. A crate with no physical key, or a key with no
#  lore, renders it as one blank line.
#  %papi% placeholders resolve against whoever is looking at the menu.

title: "&#8354f2&lCrate Preview"

# Only the four mouse clicks (left, right, shift + left, shift + right) and the
# Q key lists declared below do anything; a double click, the number keys and
# the middle click are ignored, so a fast double click can never fire twice.
strict-clicks: true

# Rewards are paged into the cells keyed "p" below.
pagination: true
paged-key: "p"

# Each row is exactly 9 characters, one per slot.
#   f  filler     p  reward cells     i  crate info
#   <  previous page   >  next page   x  close
layout:
  - "ffffiffff"
  - "fpppppppf"
  - "fpppppppf"
  - "<fffxfff>"

items:
  # Decorative background.
  filler:
    key: "f"
    material: WHITE_STAINED_GLASS_PANE
    display-name: " "

  # Closes the menu.
  close:
    key: "x"
    material: BARRIER
    display-name: "&cClose"
    click-actions:
      - "[sound] UI_BUTTON_CLICK"
      - "[close]"

  # Page arrows. Each one turns into its "nav-disabled" look, and stops
  # doing anything, when there is no page that way.
  previous-page:
    key: "<"
    material: ARROW
    display-name: "&#8354f2Previous Page"
    click-actions:
      - "[previous-page]"
      - "[sound] UI_BUTTON_CLICK"
    nav-disabled:
      material: WHITE_STAINED_GLASS_PANE
      display-name: "&7No previous page"
      lore:
        - "&8You are on the first page"

  next-page:
    key: ">"
    material: SPECTRAL_ARROW
    display-name: "&#8354f2Next Page"
    click-actions:
      - "[next-page]"
      - "[sound] UI_BUTTON_CLICK"
    nav-disabled:
      material: WHITE_STAINED_GLASS_PANE
      display-name: "&7No next page"
      lore:
        - "&8You are on the last page"

templates:
  # One reward. No slots (the pages fill the "p" cells) and no material
  # (the reward's own item is the icon). Every lore line is optional:
  # delete one and it is gone. See guis/preview.yml for what each
  # placeholder holds.
  reward:
    # Empty keeps each reward item's own name.
    display-name: ""
    lore:
      - "{tags}"
      - "&7Chance&8: &f{chance}%"
      - "&7Limit&8: &f{limit}"
    click-actions:
      - "[crates-reward]"

  # Names the crate being previewed. Purely informative; it has no click.
  # Drawn from the crate's own key item, so "material" below is only the
  # fallback for a crate that has no physical key. The key's own lore is
  # not shown here; add {lore} to bring it back.
  info:
    key: "i"
    material: CHEST
    display-name: "&#8354f2&l{crate}"
    lore:
      - "{fail}"
      - "&7Rewards&8: &f{rewards}"
