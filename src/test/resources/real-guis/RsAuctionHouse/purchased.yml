# ============================================================
#  RsAuctionHouse - purchased items (/ah purchased)
#  Managed by SnLib: new keys are auto-merged on boot; your values and
#  comments are preserved.
#  Every field supported here is listed in SnLib docs/menu-example.yml.
#  Items you bought or won that did not go straight to your inventory.
#  They wait here until you take them.
# ============================================================

# Menu title.
title: "&#8354f2&lPurchased Items"

# Enables the item pages; the previous/next buttons stop working without it.
pagination: true

# Layout character whose cells each show one stored item.
paged-key: p

# Discards clicks outside the four basic mouse buttons.
strict-clicks: true

# Cell map, one string per row.
#   f  filler         p  one item          i  summary          b  back
#   a  retrieve all   <  previous page     >  next page
# Remove a button by replacing its character with f.
layout:
  - "fffffffff"
  - "fpppppppf"
  - "fpppppppf"
  - "fpppppppf"
  - "fpppppppf"
  - "<fifbfaf>"

# Buttons.
# sn:extensible
items:

  filler:
    material: GRAY_STAINED_GLASS_PANE
    display-name: " "
    key: f

  # Back to the items menu.
  back:
    material: ARROW
    display-name: "&#8354f2&lBack"
    key: b
    lore:
      - "&7Return to your items."
    click-actions:
      - "[ah-open] items"

  # Takes every item that fits into your inventory.
  retrieve-all:
    material: HOPPER
    display-name: "&#8354f2&lRetrieve All"
    key: a
    lore:
      - "&7Takes every item that fits"
      - "&7into your inventory."
      - ""
      - "&eClick to retrieve."
    click-actions:
      - "[ah-retrieve-all] purchased"

  previous-page:
    material: ARROW
    display-name: "&#8354f2Previous Page"
    key: "<"
    click-actions:
      - "[previous-page]"
    nav-disabled:
      material: GRAY_STAINED_GLASS_PANE
      display-name: "&7No Previous Page"
      lore:
        - "&8You are on the first page"

  next-page:
    material: ARROW
    display-name: "&#8354f2Next Page"
    key: ">"
    click-actions:
      - "[next-page]"
    nav-disabled:
      material: GRAY_STAINED_GLASS_PANE
      display-name: "&7No Next Page"
      lore:
        - "&8You are on the last page"

# Cells the plugin fills, each bound by its name. An item cell shows the real item (no
# display-name here) and receives every listing placeholder: {id} {seller} {type} {currency}
# {current-bid} (the price paid) {bidder} (the buyer) {date} (when it was bought) {quantity}.
templates:

  # One stored purchase. A click retrieves it only when all of it fits in your inventory.
  listing:
    lore:
      - ""
      - "&7Seller: &f{seller}"
      - "&7Paid: {current-bid}"
      - "&7Bought: &f{date}"
      - ""
      - "&eClick to retrieve it."
    click-actions:
      - "[ah-retrieve] {id}"

  # Summary; a click reloads the list. {count} {limit}
  info:
    material: ENDER_CHEST
    display-name: "&#8354f2&lPurchased Items"
    key: i
    lore:
      - "&7Waiting: &f{count}"
      - "&7Click an item to retrieve it."
      - ""
      - "&eClick to refresh."
    click-actions:
      - "[ah-open] purchased"

  # Summary when nothing waits.
  info-empty:
    material: ENDER_CHEST
    display-name: "&#8354f2&lPurchased Items"
    key: i
    lore:
      - "&7Nothing waits here."
    click-actions:
      - "[ah-open] purchased"

  # Shown while the list loads.
  info-loading:
    material: CLOCK
    display-name: "&#8354f2&lPurchased Items"
    key: i
    lore:
      - "&7Loading..."
