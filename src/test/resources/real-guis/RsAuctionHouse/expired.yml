# ============================================================
#  RsAuctionHouse - expired items (/ah expired)
#  Managed by RsLib: new keys are auto-merged on boot; your values and
#  comments are preserved.
#  Every field supported here is listed in the RsLib documentation.
#  Listings that ended unsold, were cancelled, returned by staff, or
#  items staff sent you. They wait here until you take them.
# ============================================================

# Menu title.
title: "&#8354f2&lExpired Items"

# Enables the item pages; the previous/next buttons stop working without it.
pagination: true

# Layout character whose cells each show one stored item.
paged-key: p

# Discards clicks outside the four basic mouse buttons.
strict-clicks: true

# Cell map, one string per row.
#   f  filler         p  one item          i  summary          b  back
#   a  retrieve all   <  previous page     >  next page
# Remove a button by replacing its character with f.
layout:
  - "fffffffff"
  - "fpppppppf"
  - "fpppppppf"
  - "fpppppppf"
  - "fpppppppf"
  - "<fifbfaf>"

# Buttons.
# rs:extensible
items:

  filler:
    material: GRAY_STAINED_GLASS_PANE
    display-name: " "
    key: f

  # Back to the items menu.
  back:
    material: ARROW
    display-name: "&#8354f2&lBack"
    key: b
    lore:
      - "&7Return to your items."
    click-actions:
      - "[ah-open] items"

  # Takes every item that fits into your inventory.
  retrieve-all:
    material: HOPPER
    display-name: "&#8354f2&lRetrieve All"
    key: a
    lore:
      - "&7Takes every item that fits"
      - "&7into your inventory."
      - ""
      - "&eClick to retrieve."
    click-actions:
      - "[ah-retrieve-all] expired"

  previous-page:
    material: ARROW
    display-name: "&#8354f2Previous Page"
    key: "<"
    click-actions:
      - "[previous-page]"
    nav-disabled:
      material: GRAY_STAINED_GLASS_PANE
      display-name: "&7No Previous Page"
      lore:
        - "&8You are on the first page"

  next-page:
    material: ARROW
    display-name: "&#8354f2Next Page"
    key: ">"
    click-actions:
      - "[next-page]"
    nav-disabled:
      material: GRAY_STAINED_GLASS_PANE
      display-name: "&7No Next Page"
      lore:
        - "&8You are on the last page"

# Cells the plugin fills, each bound by its name. An item cell shows the real item (no
# display-name here) and receives every listing placeholder: {id} {type} {state} {currency}
# {price} {date} {created} {quantity}. Items staff sent you show the none label as their price.
templates:

  # One stored item. A click retrieves it only when all of it fits in your inventory.
  listing:
    lore:
      - ""
      - "&7Price: {price}"
      - "&7Since: &f{date}"
      - ""
      - "&eClick to retrieve it."
    click-actions:
      - "[ah-retrieve] {id}"

  # Summary; a click reloads the list. {count} {limit}
  info:
    material: CHEST
    display-name: "&#8354f2&lExpired Items"
    key: i
    lore:
      - "&7Waiting: &f{count}"
      - "&7Click an item to retrieve it."
      - ""
      - "&eClick to refresh."
    click-actions:
      - "[ah-open] expired"

  # Summary when nothing waits.
  info-empty:
    material: CHEST
    display-name: "&#8354f2&lExpired Items"
    key: i
    lore:
      - "&7Nothing waits here."
    click-actions:
      - "[ah-open] expired"

  # Shown while the list loads.
  info-loading:
    material: CLOCK
    display-name: "&#8354f2&lExpired Items"
    key: i
    lore:
      - "&7Loading..."
