# ============================================================
#  RsAuctionHouse - auctions you lead (/ah bids)
#  Managed by RsLib: new keys are auto-merged on boot; your values and
#  comments are preserved.
#  Every field supported here is listed in the RsLib documentation.
# ============================================================

# Menu title.
title: "&#8354f2&lYour Bids"

# Enables the auction pages; the previous/next buttons stop working without it.
pagination: true

# Layout character whose cells each show one auction.
paged-key: p

# Redraws every second (ticks) so the remaining times count down.
update-interval: 20

# Discards clicks outside the four basic mouse buttons.
strict-clicks: true

# Cell map, one string per row.
#   f  filler         p  one auction       i  summary          b  back
#   a  browse market  <  previous page     >  next page
# Remove a button by replacing its character with f.
layout:
  - "fffffffff"
  - "fpppppppf"
  - "fpppppppf"
  - "fpppppppf"
  - "fpppppppf"
  - "<fifbfaf>"

# Buttons.
# rs:extensible
items:

  filler:
    material: GRAY_STAINED_GLASS_PANE
    display-name: " "
    key: f

  # Back to the items menu.
  back:
    material: ARROW
    display-name: "&#8354f2&lBack"
    key: b
    lore:
      - "&7Return to your items."
    click-actions:
      - "[ah-open] items"

  # Opens the market fresh.
  browse:
    material: COMPASS
    display-name: "&#8354f2&lBrowse the Market"
    key: a
    lore:
      - "&7Find more auctions to bid on."
      - ""
      - "&eClick to open."
    click-actions:
      - "[ah-open] main"

  previous-page:
    material: ARROW
    display-name: "&#8354f2Previous Page"
    key: "<"
    click-actions:
      - "[previous-page]"
    nav-disabled:
      material: GRAY_STAINED_GLASS_PANE
      display-name: "&7No Previous Page"
      lore:
        - "&8You are on the first page"

  next-page:
    material: ARROW
    display-name: "&#8354f2Next Page"
    key: ">"
    click-actions:
      - "[next-page]"
    nav-disabled:
      material: GRAY_STAINED_GLASS_PANE
      display-name: "&7No Next Page"
      lore:
        - "&8You are on the last page"

# Cells the plugin fills, each bound by its name. An auction cell shows the real item (no
# display-name here) and receives every listing placeholder: {id} {seller} {state} {currency}
# {price} {current-bid} {min-bid} {buyout} {bids} {time-left} {expires} {category} {quantity}
# {version}.
templates:

  # An auction where you hold the top bid. [ah-bid] opens its bid menu (after the balance check).
  listing:
    lore:
      - ""
      - "&7Seller: &f{seller}"
      - "&7Your bid: {current-bid}"
      - "&7Next minimum bid: {min-bid}"
      - "&7Buyout: {buyout}"
      - "&7Ends in: &f{time-left}"
      - "&7State: {state}"
      - ""
      - "&eClick to open the auction."
    click-actions:
      - "[ah-bid] {id}"

  # Summary. {count}
  info:
    material: GOLD_NUGGET
    display-name: "&#8354f2&lYour Bids"
    key: i
    lore:
      - "&7Auctions you lead: &f{count}"
      - "&7You win them if nobody outbids you."

  # Summary when you lead no auction.
  info-empty:
    material: GOLD_NUGGET
    display-name: "&#8354f2&lYour Bids"
    key: i
    lore:
      - "&7You are not leading any auction."
