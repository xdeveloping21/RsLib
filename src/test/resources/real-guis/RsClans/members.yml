title: "&#8354f2&lMembers"
pagination: true
paged-key: p
layout:
  - "fffffffff"
  - "fpppppppf"
  - "fpppppppf"
  - "fpppppppf"
  - "fpppppppf"
  - "<fffxfff>"

items:
  filler:
    material: GRAY_STAINED_GLASS_PANE
    display-name: " "
    key: f

  close:
    material: BARRIER
    display-name: "&cBack"
    key: x
    lore:
      - "&7Return to the clan menu."
    click-actions:
      - "[sound] UI_BUTTON_CLICK"
      - "[custom] back"

  previous-page:
    material: ARROW
    display-name: "&#8354f2Previous Page"
    key: "<"
    click-actions:
      - "[previous-page]"
      - "[sound] UI_BUTTON_CLICK"
    nav-disabled:
      material: GRAY_STAINED_GLASS_PANE
      display-name: "&7No previous page"
      lore:
        - "&8You are on the first page"

  next-page:
    material: ARROW
    display-name: "&#8354f2Next Page"
    key: ">"
    click-actions:
      - "[next-page]"
      - "[sound] UI_BUTTON_CLICK"
    nav-disabled:
      material: GRAY_STAINED_GLASS_PANE
      display-name: "&7No next page"
      lore:
        - "&8You are on the last page"

# entry renders the viewer's own clan with manage controls; entry-view renders any
# other clan read-only. GuiService picks the template per viewer.
templates:
  entry:
    material: PLAYER_HEAD
    skull-owner: "{uuid}"
    display-name: "&#8354f2{player}"
    lore:
      - "&7Rank: &f{role}"
      - "&7Status: {status}"
      - "&7Joined: &f{joined}"
      - " "
      - "&8Left-click to promote."
      - "&8Right-click to demote."
      - "&8Shift-click to kick."
    click-actions:
      - "[custom] manage-member"

  entry-view:
    material: PLAYER_HEAD
    skull-owner: "{uuid}"
    display-name: "&#8354f2{player}"
    lore:
      - "&7Rank: &f{role}"
      - "&7Status: {status}"
      - "&7Joined: &f{joined}"
    click-actions:
      - "[sound] UI_BUTTON_CLICK"
