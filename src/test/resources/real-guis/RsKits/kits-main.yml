# ============================================================
#  RsKits - kits menu (page 1)
#  Managed by RsLib: new keys are auto-merged on boot; your values and
#  comments are preserved.
#
#  Opened by a bare /rskits (config.yml default-gui names which display menu that
#  is), by /rskits gui <id> [player], and by the navigation buttons below.
#
#  ON A KIT CELL: left-click claims, right-click previews. Shift-right previews
#  as well, shift-left claims. Middle, drop and hotbar clicks do nothing. A
#  click always acts on the kit as it is RIGHT THEN, so a kit another admin
#  deleted while this menu sat open does nothing at all.
#
#  Every kit shown here is FOUR entries under templates:, one per state, all
#  sharing one layout letter:
#    kit-<id>-available       claimable right now
#    kit-<id>-on-cooldown     the kit is recharging for this player
#    kit-<id>-one-time-used   their one-time allowance is spent
#    kit-<id>-disabled        the kit is switched off
#  The plugin paints exactly ONE of them per viewer, so the four never fight
#  over the cell. Delete the -disabled entry and a switched-off kit is drawn
#  with its -available entry instead: a disabled kit stays VISIBLE, can still
#  be previewed, and says so when it is clicked. Delete any of the other three
#  and the kit is simply not drawn while it is in that state.
#
#  TO ADD A KIT: give it a free letter in the layout, then copy the four
#  kit-default-* entries and rename them kit-<your kit id>-*. The id is the
#  name of the kit's file in kits/, without the .yml.
#  TO REMOVE A KIT: take its letter out of the layout, or delete its entries.
#  Give every kit its OWN letter: two kits on one cell means one of them is
#  painted over by the other.
#
#  Placeholders available in every display-name and lore below:
#    {kit}        the kit id
#    {cooldown}   time left before the kit can be claimed again, or the ready
#                 label from the status: section of the lang file
#  Both resolve in ALL FOUR states, in display-name and in lore.
#  PlaceholderAPI placeholders resolve too, per viewer.
#
#  Menu ids ("[kits] open <id>") are file names under guis/ without the .yml,
#  in lower case.
#
#  Sounds come from config.yml sounds: (gui-click when a button opens another
#  menu or a preview, claim-success and claim-denied on a claim). Add a
#  "[sound] SOUND_ID" line to any click-actions list below to layer another.
#
#  TO MOVE a button, move its letter in the layout. TO REMOVE one, delete its
#  letter from the layout and leave the entry here.
#  Colours: use &#RRGGBB. A bare #RRGGBB is not a colour and renders as text.
# ============================================================

title: "&#8354f2&lKits"

# f filler   k the default kit   m go to page 2
layout:
  - "fffffffff"
  - "f   k  mf"
  - "fffffffff"

# Decoration and navigation. An entry with click-actions does something; one
# without them is inert scenery.
# rs:extensible
items:

  # Fills every cell no kit and no button claims.
  filler:
    material: GRAY_STAINED_GLASS_PANE
    display-name: " "
    key: f

  # There is no pagination here: a "page" is another file under guis/ linked
  # both ways, so you can chain as many as you like.
  more-menu:
    material: ENDER_PEARL
    display-name: "&#8354f2Más kits &7»"
    key: m
    glow: true
    lore:
      - "&7Hay más kits esperando en la"
      - "&7página siguiente."
      - ""
      - "&eClic para abrir"
    click-actions:
      - "[kits] open kits-more"

# One entry per kit per state, filled in by the plugin per viewer, which is why
# they are templates rather than items: their text carries the placeholders
# above. The action after "[kits]" is what the click does and must not be
# renamed.
# rs:extensible
templates:

  # --- default, claimable right now ---
  kit-default-available:
    material: CHEST
    display-name: "&aKit inicial"
    key: k
    glow: true
    lore:
      - "&7El kit inicial que recibe cada jugador."
      - ""
      - "&7Enfriamiento: &f{cooldown}"
      - ""
      - "&eClic izquierdo para reclamar"
      - "&eClic derecho para ver su contenido"
    left-click-actions:
      - "[kits] claim"
    right-click-actions:
      - "[kits] preview"

  # --- default, recharging ---
  # Left-click still claims: the claim is what answers with the wait left.
  kit-default-on-cooldown:
    material: BARRIER
    display-name: "&cKit inicial"
    key: k
    lore:
      - "&7El kit inicial que recibe cada jugador."
      - ""
      - "&cEn enfriamiento: &f{cooldown}"
      - ""
      - "&eClic derecho para ver su contenido"
    left-click-actions:
      - "[kits] claim"
    right-click-actions:
      - "[kits] preview"

  # --- default, one-time allowance spent ---
  kit-default-one-time-used:
    material: GRAY_DYE
    display-name: "&7Kit inicial"
    key: k
    lore:
      - "&7El kit inicial que recibe cada jugador."
      - ""
      - "&7Ya reclamaste este kit."
      - ""
      - "&eClic derecho para ver su contenido"
    left-click-actions:
      - "[kits] claim"
    right-click-actions:
      - "[kits] preview"

  # --- default, switched off ---
  kit-default-disabled:
    material: RED_STAINED_GLASS_PANE
    display-name: "&cKit inicial &7(Desactivado)"
    key: k
    lore:
      - "&7Este kit está desactivado por ahora."
      - "&7Volverá pronto."
      - ""
      - "&eClic derecho para ver su contenido"
    left-click-actions:
      - "[kits] claim"
    right-click-actions:
      - "[kits] preview"
