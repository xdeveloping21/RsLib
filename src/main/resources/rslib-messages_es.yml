# Mensajes compartidos de RsLib. Cada plugin copia los que falten en su archivo de idioma,
# donde se pueden editar como cualquier otro mensaje.
rslib:
  no-permission: "&cNo tienes permiso para hacer eso."
  players-only: "&cSolo los jugadores pueden usar este comando."
  usage: "&cModo de uso: &f{usage}"
  invalid-number: "&c'&f{value}&c' no es un número válido."
  invalid-value: "&c'&f{value}&c' no es una opción válida."
  out-of-range: "&cUsa un número entre &f{min}&c y &f{max}&c (escribiste &f{value}&c)."
  number-too-small: "&cEl número debe ser &f{min}&c o mayor (escribiste &f{value}&c)."
  player-not-found: "&cNo hay ningún jugador llamado '&f{value}&c'."
  unknown-subcommand: "&cNo existe el subcomando '&f{value}&c'."
  reload-done: "&aConfiguración y mensajes recargados."
  debug-on: "&aLos mensajes de depuración de {plugin} están activados."
  debug-off: "&eLos mensajes de depuración de {plugin} están desactivados."
  update-available: "&e{plugin} &7tiene una versión nueva: &a{new} &7(instalada &c{current}&7)"
  input:
    cancel-hint: "&7Escribe &f{words}&7 para cancelar."
    cancelled: "&cCancelado."
    timed-out: "&cTardaste demasiado en responder."
    too-short: "&cEscribe al menos &f{min}&c caracteres."
    too-long: "&cEscribe como máximo &f{max}&c caracteres."
  wizard:
    step: "&8» &7Pregunta &f{step}&7 de &f{steps}"
    options: "&7Opciones: &f{options}"
    back-hint: "&7Escribe &f{words}&7 para volver a la pregunta anterior."
    summary: "&6Revisa tus respuestas:"
    summary-line: "&8- &7{name}: &f{value}"
    confirm: "&7Escribe &a{confirm}&7 para aplicar, &e{back}&7 para cambiar la última respuesta o &c{cancel}&7 para cancelar."
  editor:
    empty-hand: "&cSostén en la mano el ítem que quieres agregar."
    item-refused: "&cEse ítem no se puede agregar aquí."
  teleport:
    warmup: "&7Teletransportando en &e{time}&7. No te muevas."
    cancelled-move: "&cTeletransporte cancelado: te moviste."
    cancelled-damage: "&cTeletransporte cancelado: recibiste daño."
  rewards:
    claimed: "&aRecibiste &f{count}&a recompensas que te estaban esperando."
    waiting: "&f{count}&e recompensas no cupieron en tu inventario y se guardan para ti."
  selection:
    pos1-set: "&aPos1 marcada: &f{x}, {y}, {z} &7({world})"
    pos2-set: "&aPos2 marcada: &f{x}, {y}, {z} &7({world})"
    different-worlds: "&cAmbas posiciones deben estar en el mismo mundo."
    too-big: "&cSelección demasiado grande: &f{volume} &7(máx. {max})"
    no-permission: "&cNo puedes usar esta varita."
    timeout: "&7La selección caducó."
  notices:
    more: "&7...y &f{count}&7 más."
  help:
    header: "&6&l{plugin} &8» &7Comandos"
    entry: "&e{usage} &7{description}"
    footer: "[noprefix]&7Página &f{page}&7 de &f{total}&7. Más páginas: &f{command} <página>"
    group-header: "&6&l{group} &8» &7{description}"
    group-footer: "[noprefix]&7Página &f{page}&7 de &f{total}&7. Más páginas: &f{path} help <página>"
