# Mensajes compartidos de RsLib. Cada plugin copia los que falten en su archivo de idioma,
# donde se pueden editar como cualquier otro mensaje.
rslib:
  no-permission: "&cNo tienes permiso para hacer eso."
  players-only: "&cSolo los jugadores pueden usar este comando."
  usage: "&cModo de uso: &f{usage}"
  invalid-number: "&c'&f{value}&c' no es un número válido."
  invalid-value: "&c'&f{value}&c' no es una opción válida."
  out-of-range: "&cUsa un número entre &f{min}&c y &f{max}&c (escribiste &f{value}&c)."
  number-too-small: "&cEl número debe ser &f{min}&c o mayor (escribiste &f{value}&c)."
  player-not-found: "&cNo hay ningún jugador llamado '&f{value}&c'."
  unknown-subcommand: "&cNo existe el subcomando '&f{value}&c'."
  reload-done: "&aConfiguración y mensajes recargados."
  debug-on: "&aLos mensajes de depuración de {plugin} están activados."
  debug-off: "&eLos mensajes de depuración de {plugin} están desactivados."
  update-available: "&e{plugin} &7tiene una versión nueva: &a{new} &7(instalada &c{current}&7)"
  input:
    cancel-hint: "&7Escribe &f{words}&7 para cancelar."
    cancelled: "&cCancelado."
    timed-out: "&cTardaste demasiado en responder."
    too-short: "&cEscribe al menos &f{min}&c caracteres."
    too-long: "&cEscribe como máximo &f{max}&c caracteres."
  wizard:
    step: "&8» &7Pregunta &f{step}&7 de &f{steps}"
    options: "&7Opciones: &f{options}"
    back-hint: "&7Escribe &f{words}&7 para volver a la pregunta anterior."
    summary: "&6Revisa tus respuestas:"
    summary-line: "&8- &7{name}: &f{value}"
    confirm: "&7Escribe &a{confirm}&7 para aplicar, &e{back}&7 para cambiar la última respuesta o &c{cancel}&7 para cancelar."
  editor:
    empty-hand: "&cSostén en la mano el ítem que quieres agregar."
    item-refused: "&cEse ítem no se puede agregar aquí."
  teleport:
    warmup: "&7Teletransportando en &e{time}&7. No te muevas."
    cancelled-move: "&cTeletransporte cancelado: te moviste."
    cancelled-damage: "&cTeletransporte cancelado: recibiste daño."
  rewards:
    claimed: "&aRecibiste &f{count}&a recompensas que te estaban esperando."
    waiting: "&f{count}&e recompensas no cupieron en tu inventario y se guardan para ti."
  selection:
    pos1-set: "&aPos1 marcada: &f{x}, {y}, {z} &7({world})"
    pos2-set: "&aPos2 marcada: &f{x}, {y}, {z} &7({world})"
    different-worlds: "&cAmbas posiciones deben estar en el mismo mundo."
    too-big: "&cSelección demasiado grande: &f{volume} &7(máx. {max})"
    no-permission: "&cNo puedes usar esta varita."
    timeout: "&7La selección caducó."
  notices:
    more: "&7...y &f{count}&7 más."
  settings:
    menu-title: "&8Preferencias"
    none: "&7No hay preferencias para ti."
    plugin: "&8{plugin}"
    value: "&7Valor: &f{value}"
    state-on: "&aActivado"
    state-off: "&cDesactivado"
    click-toggle: "&eHaz clic para cambiarlo."
    click-cycle: "&eClic izquierdo: siguiente. Clic derecho: anterior."
    click-number: "&eClic izquierdo: +{step}. Clic derecho: -{step}."
    previous-page: "&ePágina anterior"
    next-page: "&ePágina siguiente"
    close: "&cCerrar"
  help:
    header: "&6&l{plugin} &8» &7Comandos"
    entry: "&e{usage} &7{description}"
    footer: "[noprefix]&7Página &f{page}&7 de &f{total}&7. Más páginas: &f{command} <página>"
    group-header: "&6&l{group} &8» &7{description}"
    group-footer: "[noprefix]&7Página &f{page}&7 de &f{total}&7. Más páginas: &f{path} help <página>"
  format:
    relative-past: "hace {time}"
    relative-future: "en {time}"
    relative-now: "ahora"
    days: "{amount} d"
    hours: "{amount} h"
    minutes: "{amount} min"
    seconds: "{amount} s"
  # Respuestas propias de RsLib a /rslib settings, logs, db y alts, en el idioma elegido con lang
  # en plugins/RsLib/config.yml. Se quedan en RsLib: no se copian a los archivos de los plugins.
  admin:
    logs:
      usage: "Uso: /{label} logs <jugador|*> [plugin|*] [página]"
      player-not-found: "No se encontró al jugador: {player}"
      plugin-not-found: "Ningún plugin con registro de auditoría se llama {plugin}."
      bad-page: "La página debe ser un número desde 1: {page}"
      read-failed: "&cNo se pudieron leer los registros de auditoría; revisa la consola."
      everybody: "todos"
      every-plugin: "todos los plugins"
      none: "&eNo hay entradas de auditoría de {player} en {plugin}."
      empty-page: "&eLa página {page} está vacía: hay {pages} página(s)."
      header: "&6Registro de auditoría de {player} en {plugin}: {total} entradas, página {page} de {pages}"
      next-page: "&7Página siguiente: &e{command}"
      click-to-open: "Haz clic para abrirla"
    db:
      usage: "Uso: /{label} db <export <plugin>|import <plugin> <archivo> [--force]>"
      usage-export: "Uso: /{label} db export <plugin>"
      usage-import: "Uso: /{label} db import <plugin> <archivo> [--force]"
      no-database: "El plugin {plugin} no tiene base de datos de RsLib."
      no-file: "No existe el archivo {file} en plugins/{plugin}/."
      running: "Ya hay una exportación o importación de la base de datos de {plugin} en curso."
      exporting: "Exportando la base de datos de {plugin} ({database})..."
      exported: "Exportación de {plugin} terminada: {tables} tablas, {rows} filas en {millis} ms. Archivo: plugins/{plugin}/{file}"
      importing: "Importando {file} en la base de datos de {plugin} ({database})..."
      importing-force: "Importando {file} en la base de datos de {plugin} ({database}) con --force (las filas con la misma clave se sobrescriben)..."
      imported: "Importación en {plugin} terminada: {tables} tablas, {rows} filas en {millis} ms. Reinicia el servidor para que {plugin} cargue los datos importados."
      progress: "- {table}: {rows} filas"
      export-refused: "Exportación de {plugin} rechazada: {reason}"
      export-failed: "La exportación de {plugin} falló: {reason}"
      import-refused: "Importación en {plugin} rechazada: {reason}"
      import-failed: "La importación en {plugin} falló: {reason}"
    alts:
      usage: "Uso: /{label} alts <jugador>"
      disabled: "La detección de cuentas alternativas está desactivada (accounts.enabled en el config.yml de RsLib)."
      read-failed: "No se pudieron leer los registros de cuentas alternativas: {error}"
      no-record: "No hay registro de que {player} haya entrado al servidor."
      none: "{player} no comparte dirección con ninguna otra cuenta."
      header: "Cuentas que entraron desde una dirección de {player} ({count}):"
      entry: "- {name} ({uuid}), visto por última vez hace {time}"
    settings:
      players-only: "Solo un jugador puede usar esto."
