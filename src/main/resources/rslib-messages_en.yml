# RsLib's shared messages. Each plugin copies the missing ones into its language file,
# where they can be edited like any other message.
rslib:
  no-permission: "&cYou are not allowed to do that."
  players-only: "&cOnly players can use this command."
  usage: "&cHow to use it: &f{usage}"
  invalid-number: "&c'&f{value}&c' is not a valid number."
  invalid-value: "&c'&f{value}&c' is not a valid option."
  out-of-range: "&cUse a number between &f{min}&c and &f{max}&c (you wrote &f{value}&c)."
  number-too-small: "&cThe number must be &f{min}&c or more (you wrote &f{value}&c)."
  player-not-found: "&cThere is no player called '&f{value}&c'."
  unknown-subcommand: "&cThere is no subcommand '&f{value}&c'."
  reload-done: "&aConfiguration and messages reloaded."
  debug-on: "&aDebug messages of {plugin} are now on."
  debug-off: "&eDebug messages of {plugin} are now off."
  update-available: "&e{plugin} &7has a new version: &a{new} &7(installed &c{current}&7)"
  input:
    cancel-hint: "&7Type &f{words}&7 to cancel."
    cancelled: "&cCancelled."
    timed-out: "&cYou took too long to answer."
    too-short: "&cWrite at least &f{min}&c characters."
    too-long: "&cWrite at most &f{max}&c characters."
  wizard:
    step: "&8» &7Question &f{step}&7 of &f{steps}"
    options: "&7Options: &f{options}"
    back-hint: "&7Type &f{words}&7 to go back to the previous question."
    summary: "&6Check your answers:"
    summary-line: "&8- &7{name}: &f{value}"
    confirm: "&7Type &a{confirm}&7 to apply, &e{back}&7 to change the last answer or &c{cancel}&7 to cancel."
  editor:
    empty-hand: "&cHold the item you want to add in your hand."
    item-refused: "&cThat item cannot be added here."
  teleport:
    warmup: "&7Teleporting in &e{time}&7. Do not move."
    cancelled-move: "&cTeleport cancelled - you moved."
    cancelled-damage: "&cTeleport cancelled - you took damage."
  rewards:
    claimed: "&aYou received &f{count}&a rewards that were waiting for you."
    waiting: "&f{count}&e rewards did not fit in your inventory and are kept for you."
  selection:
    pos1-set: "&aPos1 set: &f{x}, {y}, {z} &7({world})"
    pos2-set: "&aPos2 set: &f{x}, {y}, {z} &7({world})"
    different-worlds: "&cBoth positions must be in the same world."
    too-big: "&cSelection too big: &f{volume} &7(max {max})"
    no-permission: "&cYou cannot use this wand."
    timeout: "&7Selection expired."
  notices:
    more: "&7...and &f{count}&7 more."
  settings:
    menu-title: "&8Settings"
    none: "&7There are no settings for you."
    plugin: "&8{plugin}"
    value: "&7Value: &f{value}"
    state-on: "&aOn"
    state-off: "&cOff"
    click-toggle: "&eClick to switch it."
    click-cycle: "&eLeft click: next. Right click: previous."
    click-number: "&eLeft click: +{step}. Right click: -{step}."
    previous-page: "&ePrevious page"
    next-page: "&eNext page"
    close: "&cClose"
  help:
    header: "&6&l{plugin} &8» &7Commands"
    entry: "&e{usage} &7{description}"
    footer: "[noprefix]&7Page &f{page}&7 of &f{total}&7. Next pages: &f{command} <page>"
    group-header: "&6&l{group} &8» &7{description}"
    group-footer: "[noprefix]&7Page &f{page}&7 of &f{total}&7. Next pages: &f{path} help <page>"
  format:
    relative-past: "{time} ago"
    relative-future: "in {time}"
    relative-now: "now"
    days: "{amount}d"
    hours: "{amount}h"
    minutes: "{amount}m"
    seconds: "{amount}s"
  # RsLib's own answers to /rslib settings, logs, db and alts, in the language set with lang in
  # plugins/RsLib/config.yml. They stay in RsLib: they are not copied into the plugins' files.
  admin:
    logs:
      usage: "Usage: /{label} logs <player|*> [plugin|*] [page]"
      player-not-found: "Player not found: {player}"
      plugin-not-found: "No plugin with an audit log is called {plugin}."
      bad-page: "The page must be a number from 1: {page}"
      read-failed: "&cCould not read the audit logs; see the console."
      everybody: "everybody"
      every-plugin: "every plugin"
      none: "&eNo audit log entries for {player} in {plugin}."
      empty-page: "&ePage {page} is empty: there are {pages} page(s)."
      header: "&6Audit log of {player} in {plugin}: {total} entries, page {page} of {pages}"
      next-page: "&7Next page: &e{command}"
      click-to-open: "Click to open"
    db:
      usage: "Usage: /{label} db <export <plugin>|import <plugin> <file> [--force]>"
      usage-export: "Usage: /{label} db export <plugin>"
      usage-import: "Usage: /{label} db import <plugin> <file> [--force]"
      no-database: "Plugin {plugin} has no RsLib database."
      no-file: "There is no file {file} in plugins/{plugin}/."
      running: "A database export or import of {plugin} is already running."
      exporting: "Exporting the database of {plugin} ({database})..."
      exported: "Export of {plugin} done: {tables} tables, {rows} rows in {millis} ms. File: plugins/{plugin}/{file}"
      importing: "Importing {file} into the database of {plugin} ({database})..."
      importing-force: "Importing {file} into the database of {plugin} ({database}) with --force (rows with the same key are overwritten)..."
      imported: "Import into {plugin} done: {tables} tables, {rows} rows in {millis} ms. Restart the server so {plugin} loads the imported data."
      progress: "- {table}: {rows} rows"
      export-refused: "Export of {plugin} refused: {reason}"
      export-failed: "Export of {plugin} failed: {reason}"
      import-refused: "Import into {plugin} refused: {reason}"
      import-failed: "Import into {plugin} failed: {reason}"
    alts:
      usage: "Usage: /{label} alts <player>"
      disabled: "Alt-account detection is off (accounts.enabled in RsLib's config.yml)."
      read-failed: "Could not read the alt-account records: {error}"
      no-record: "No join of {player} is recorded."
      none: "{player} shares no address with another account."
      header: "Accounts that joined from an address of {player} ({count}):"
      entry: "- {name} ({uuid}), last seen {time} ago"
    settings:
      players-only: "Only a player can use this."
