# RsLib's shared messages. Each plugin copies the missing ones into its language file,
# where they can be edited like any other message.
rslib:
  no-permission: "&cYou are not allowed to do that."
  players-only: "&cOnly players can use this command."
  usage: "&cHow to use it: &f{usage}"
  invalid-number: "&c'&f{value}&c' is not a valid number."
  invalid-value: "&c'&f{value}&c' is not a valid option."
  out-of-range: "&cUse a number between &f{min}&c and &f{max}&c (you wrote &f{value}&c)."
  number-too-small: "&cThe number must be &f{min}&c or more (you wrote &f{value}&c)."
  player-not-found: "&cThere is no player called '&f{value}&c'."
  unknown-subcommand: "&cThere is no subcommand '&f{value}&c'."
  reload-done: "&aConfiguration and messages reloaded."
  debug-on: "&aDebug messages of {plugin} are now on."
  debug-off: "&eDebug messages of {plugin} are now off."
  update-available: "&e{plugin} &7has a new version: &a{new} &7(installed &c{current}&7)"
  input:
    cancel-hint: "&7Type &f{words}&7 to cancel."
    cancelled: "&cCancelled."
    timed-out: "&cYou took too long to answer."
    too-short: "&cWrite at least &f{min}&c characters."
    too-long: "&cWrite at most &f{max}&c characters."
  teleport:
    warmup: "&7Teleporting in &e{time}&7. Do not move."
    cancelled-move: "&cTeleport cancelled - you moved."
    cancelled-damage: "&cTeleport cancelled - you took damage."
  selection:
    pos1-set: "&aPos1 set: &f{x}, {y}, {z} &7({world})"
    pos2-set: "&aPos2 set: &f{x}, {y}, {z} &7({world})"
    different-worlds: "&cBoth positions must be in the same world."
    too-big: "&cSelection too big: &f{volume} &7(max {max})"
    no-permission: "&cYou cannot use this wand."
    timeout: "&7Selection expired."
  settings:
    menu-title: "&8Settings"
    none: "&7There are no settings for you."
    plugin: "&8{plugin}"
    value: "&7Value: &f{value}"
    state-on: "&aOn"
    state-off: "&cOff"
    click-toggle: "&eClick to switch it."
    click-cycle: "&eLeft click: next. Right click: previous."
    click-number: "&eLeft click: +{step}. Right click: -{step}."
    previous-page: "&ePrevious page"
    next-page: "&eNext page"
    close: "&cClose"
  help:
    header: "&6&l{plugin} &8» &7Commands"
    entry: "&e{usage} &7{description}"
    footer: "[noprefix]&7Page &f{page}&7 of &f{total}&7. Next pages: &f{command} <page>"
    group-header: "&6&l{group} &8» &7{description}"
    group-footer: "[noprefix]&7Page &f{page}&7 of &f{total}&7. Next pages: &f{path} help <page>"
