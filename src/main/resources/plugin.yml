name: RsLib
version: '${project.version}'
main: com.rs.lib.RsLibPlugin
api-version: '1.20'
load: STARTUP
author: Raul Sanhueza (RsDevelopment)
website: https://rsdevelopment.dev
description: Librería base de los plugins Rs.
softdepend: [PlaceholderAPI, Vault, WorldGuard]
commands:
  rslib:
    description: RsLib administration.
    usage: /rslib <version|plugins|integrations|iteminfo|update|reload|logs|debug|db|alts|settings|help>
permissions:
  # Grants every subcommand but debug and db. rslib.admin.debug and rslib.admin.db are not
  # children: grant them apart.
  rslib.admin:
    description: Grants every RsLib admin subcommand except debug and db.
    default: op
    children:
      rslib.admin.version: true
      rslib.admin.plugins: true
      rslib.admin.integrations: true
      rslib.admin.iteminfo: true
      rslib.admin.update: true
      rslib.admin.reload: true
      rslib.admin.alts: true
      rslib.admin.logs: true
  rslib.admin.version:
    description: Allows /rslib version.
    default: op
  rslib.admin.plugins:
    description: Allows /rslib plugins.
    default: op
  rslib.admin.integrations:
    description: Allows /rslib integrations.
    default: op
  rslib.admin.iteminfo:
    description: Allows /rslib iteminfo.
    default: op
  rslib.admin.update:
    description: Allows /rslib update and receives RsLib update notices.
    default: op
  rslib.admin.reload:
    description: Allows /rslib reload.
    default: op
  rslib.admin.logs:
    description: Allows /rslib logs (the audit log of every plugin).
    default: op
  rslib.admin.debug:
    description: Allows /rslib debug.
    default: op
  rslib.admin.db:
    description: Allows /rslib db export and import (a plugin's whole database).
    default: op
  rslib.admin.alts:
    description: Allows /rslib alts (accounts that joined from the same address).
    default: op
  rslib.settings:
    description: Allows /rslib settings, the menu with your preferences in every plugin.
    default: true
  rslib.chat.bypass:
    description: Reads every chat message and is read by everyone, whatever the plugins' chat rules say.
    default: false
