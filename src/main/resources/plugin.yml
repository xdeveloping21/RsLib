name: RsLib
version: '${project.version}'
main: com.rs.lib.RsLibPlugin
api-version: '1.20'
load: STARTUP
author: Raul Sanhueza (RsDevelopment)
website: https://rsdevelopment.dev
description: Librería base de los plugins Rs.
softdepend: [PlaceholderAPI, Vault]
commands:
  rslib:
    description: RsLib administration.
    usage: /rslib <version|reload [plugin]|update|debug|integrations|iteminfo>
permissions:
  rslib.admin:
    description: Every RsLib administration command.
    default: op
    children:
      rslib.admin.reload: true
      rslib.admin.version: true
      rslib.admin.update: true
      rslib.admin.debug: true
      rslib.admin.integrations: true
      rslib.admin.iteminfo: true
  rslib.admin.reload:
    description: Reload RsLib's config.yml, or a plugin built on RsLib.
    default: op
  rslib.admin.version:
    description: See the RsLib version and the plugins using it.
    default: op
  rslib.admin.update:
    description: Run an RsLib update pass now and be told when a new RsLib was installed.
    default: op
  rslib.admin.debug:
    description: Switch RsLib's own debug output on and off.
    default: op
  rslib.admin.integrations:
    description: See which optional plugins RsLib and each plugin built on it are hooked into.
    default: op
  rslib.admin.iteminfo:
    description: See the persistent data of the item in your main hand.
    default: op
